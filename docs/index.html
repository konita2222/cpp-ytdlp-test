    <!-- GitHub Pages / ローカルファイル用 自動リダイレクト (Vanilla JSフォールバック) -->
    <script>
      (function() {
        var isGitHubPages = window.location.hostname.includes('github.io');
        var isFileProto = window.location.protocol === 'file:';
        if (isGitHubPages || isFileProto) {
          var newUrl = window.location.href.split('#')[0].split('?')[0];
          if (!newUrl.endsWith('/')) {
            if (newUrl.endsWith('index.html')) {
              newUrl = newUrl.replace('index.html', '');
            } else {
              newUrl += '/';
            }
          }
          window.location.replace(newUrl + 'docs/index.html');
        }
      })();
    </script>
